services:

    _defaults:
        autoconfigure: true
        autowire:      true

    Jmf\Grid\:
        resource: '../src/'
        exclude:
            - '../src/Definition/'
            - '../src/Exception/'
            - '../src/Model/'
            - '../src/JmfGridBundle.php'

    Jmf\Grid\Generation\GridGenerator:
        factory: ['@Jmf\Grid\Generation\GridGeneratorFactory', 'create']

    Jmf\Grid\Generation\GridGeneratorFactory:
        arguments:
            $gridConfigs: '%jmf_grid.grid_configurations%'

    Jmf\Grid\Twig\GridExtension:
        arguments:
            $templatePath: '%jmf_grid.template_path%'
            $prefix:       '%jmf_grid.twig_functions_prefix%'
        tags:
            - 'twig.extension'
